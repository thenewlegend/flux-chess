<!DOCTYPE html>
<html>
<head>
  <title>Portal Chess</title>

  <link rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Portal Chess</h2>

  <div id="controls">
    <button onclick="restartGame()">Restart</button>
    <button onclick="resign()">Resign</button>
  </div>

  <div id="status"></div>
  <div id="portalInfo"></div>

  <div id="board" style="width: 400px; margin: 20px auto;"></div>

  <!-- Popup -->
  <div id="restartPopup" class="popup hidden">
    <div class="popup-content">
      <p>Game ended.<br>Restart now?</p>
      <div class="popup-actions">
        <button onclick="confirmRestart()">Yes</button>
        <button onclick="closePopup()">No</button>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
