<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLUX Chess</title>

  <!-- External libraries -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="style.css">

</head>

<body>
  <canvas id="particles-canvas"></canvas>

  <header class="app-header">
    <div class="header-title">
      <img src="img/flux-chess-white.png" alt="FLUX Logo" id="app-logo">
      <div class="header-text">
        <h2>FLUX</h2>
        <p>Chess</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-button" onclick="openTutorial()" aria-label="Tutorial">
        <span class="material-symbols-rounded">help</span>
      </button>
      <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle Theme">
        <span class="material-symbols-rounded" id="theme-icon">light_mode</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="left-panel">
      <div class="card status-card">
        <div id="status">Ready to play.</div>
        <div id="portalInfo" class="secondary-text">Swap in - move(s)</div>
        <div id="onlineStatus" class="secondary-text hidden" style="margin-top: 12px; font-size: 0.9rem; color: var(--md-sys-color-primary);"></div>
      </div>

      <div class="card controls-card">
        <button class="btn filled" onclick="restartGame()">
          <span class="material-symbols-rounded">refresh</span> Restart
        </button>
        <button class="btn tonal" onclick="resign()">
          <span class="material-symbols-rounded">flag</span> Resign
        </button>
      </div>
    </div>

    <div class="board-container">
      <div id="board"></div>
    </div>
  </main>

  <!-- Restart Popup Modal -->
  <div id="restartPopup" class="modal hidden">
    <div class="modal-surface">
      <h3 class="modal-title">Game Ended</h3>
      <p>Restart now?</p>
      <div class="modal-actions">
        <button class="btn tonal" onclick="closePopup()">No</button>
        <button class="btn filled" onclick="confirmRestart()">Yes</button>
      </div>
    </div>
  </div>

  <!-- Tutorial Modal -->
  <div id="tutorialModal" class="modal hidden">
    <div class="modal-surface tutorial-surface">
      <div class="modal-header">
        <h3 class="modal-title">How to Play</h3>
        <button class="icon-button" onclick="closeTutorial()" aria-label="Close Tutorial">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="tutorial-content">
        <div class="tutorial-step">
          <p>Normal chess rules apply, but there are portals on the board!</p>
          <img src="https://placehold.co/400x400/2a3b5c/ebd071?text=GIF+1:1" alt="Portal entering" class="tutorial-img">
        </div>
        <div class="tutorial-step">
          <p>Every few moves, pieces standing on portals swap positions.</p>
          <img src="https://placehold.co/400x400/2a3b5c/ebd071?text=GIF+1:1" alt="Portal swapping" class="tutorial-img">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn filled" onclick="closeTutorial()">Got it!</button>
      </div>
    </div>
  </div>

  <!-- Splash Screen / Lobby -->
  <div id="splash" class="splash-screen">
    <div class="splash-inner" id="splash-main">
      <img src="img/flux-chess-white.png" alt="FLUX Chess Logo" id="splash-logo" />
      <div class="text-block">
        <h1>FLUX</h1>
        <div class="lobby-buttons" style="margin-top: 30px; display: flex; flex-direction: column; gap: 16px; align-items: center;">
          <button class="btn filled" onclick="startLocalGame()" style="width: 200px; font-size: 1.1rem; padding: 14px 24px;">Play Local</button>
          <button class="btn tonal" onclick="showOnlineLobby()" style="width: 200px; font-size: 1.1rem; padding: 14px 24px;">Play Online</button>
        </div>
      </div>
    </div>

    <!-- Online Lobby Panel -->
    <div class="splash-inner hidden" id="splash-online" style="max-width: 400px; width: 90%; background: var(--md-sys-color-surface); padding: 32px; border-radius: 24px; box-shadow: var(--md-elevation-3);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0; color: var(--md-sys-color-on-surface);">Online Multiplayer</h2>
      </div>

      <div id="room-section" class="lobby-section">
        <h3 style="margin-bottom: 16px;">Host a Game</h3>
        <button class="btn filled" onclick="createRoom()" style="width: 100%;">Generate Room Code</button>
        <div id="createdRoomCode" class="room-code-display hidden" style="margin-top: 16px; font-size: 1.5rem; letter-spacing: 4px; font-weight: bold; padding: 12px; background: var(--md-sys-color-background); border-radius: 8px;"></div>
        <p id="waitingMessage" class="secondary-text hidden" style="margin-top: 12px; animation: softPulse 2s infinite;">Waiting for guest to join...</p>
      </div>

      <div class="lobby-divider" style="margin: 24px 0; text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 0.9rem; font-weight: bold;">OR</div>

      <div class="lobby-section">
        <h3 style="margin-bottom: 16px;">Join as Guest</h3>
        <input type="text" id="joinRoomCode" placeholder="Enter Room Code" class="lobby-input text-center" style="text-transform: uppercase;">
        <button class="btn tonal" id="joinBtn" onclick="joinRoomAsGuest()" style="width: 100%; margin-top: 12px;">Join Game</button>
        <p id="joinError" class="error-text hidden" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px;"></p>
      </div>
      
      <button class="btn text-btn" onclick="backToMain()" style="margin-top: 24px; padding: 8px 16px; background: transparent; color: var(--md-sys-color-on-surface-variant);">← Back</button>
    </div>
  </div>

  <!-- Audio -->
  <audio id="moveSound" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3"></audio>
  <audio id="captureSound" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3"></audio>
  <audio id="endSound" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/game-end.mp3"></audio>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>

</html>
