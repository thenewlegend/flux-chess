<!DOCTYPE html>
<html>
<head>
  <title>Portal Chess</title>

  <!-- Chessboard CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
      integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
      crossorigin="anonymous">
</head>

<body>

  <h2>Portal Chess</h2>

  <div id="status"></div>
  <div id="portalInfo"></div>
  <div id="status"></div>

  <div id="controls">
    <button onclick="resign()">Resign</button>

    <button onclick="restartGame()">Restart</button>
  </div>

  

<div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div id="board" style="width: 400px"></div>
</div>

<div id="restartPopup" class="popup hidden">
  <div class="popup-content">
    <p>Game ended.<br>
      Restart now?</p>
    <div class="popup-actions">
      <button onclick="confirmRestart()">Yes</button>
      <button onclick="closePopup()">No</button>
    </div>
  </div>
</div>

  <!-- Libraries -->
<!-- chess.js (stable, non-module) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
        crossorigin="anonymous"></script>

<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
        integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
        crossorigin="anonymous"></script>

<!-- your script -->
<script src="script.js"></script>

</body>
</html>
